# Java's IPv6 route to Google's Maven drops the TLS handshake on this network; IPv4 is reliable.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8 -Djava.net.preferIPv4Stack=true
systemProp.java.net.preferIPv4Stack=true
kotlin.daemon.jvmargs=-Xmx1536m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=4
android.useAndroidX=true
kotlin.code.style=official

# Several agents build in parallel on a 16 GB machine: compile Kotlin inside the Gradle daemon
# instead of a second daemon per build, and let idle daemons exit after ten minutes.
kotlin.compiler.execution.strategy=in-process
org.gradle.daemon.idletimeout=600000
