name: Android

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    # Green runs took 13-19 minutes by 4 Nov; the suite has grown since, and every master run
    # from 5 Nov was cancelled at 20 minutes without a verdict.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test Python tools
        run: |
          python3 -m unittest discover -s tools/strings -p 'test_*.py' -v
          python3 -m unittest discover -s tools/parity -p 'test_*.py' -v
          python3 -m unittest discover -s tools/play -p 'test_*.py' -v
          python3 -m unittest discover -s tools/release -p 'test_*.py' -v
          python3 tools/play/check_listing.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The default list still asks for the long-removed 'tools' package and fails.
          packages: platform-tools
      - name: Install project SDK
        # core:map builds its fog layer with the NDK and CMake pinned in core/map/build.gradle.kts.
        run: sdkmanager 'platforms;android-37.2' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Test, lint and build APKs
        # The baselines are recorded on macOS; Ubuntu renders the same tests without image comparison.
        # The root lintDebug selector includes every Android core module as well as app.
        run: ./gradlew --no-daemon -Proborazzi.test.verify=false test lintDebug :app:assembleDebug :app:assembleRelease :app:bundleRelease :app:verifyReleaseSentryWiring
      - name: Check release native page alignment
        run: tools/release/check_16kb.sh app/build/outputs/apk/release/app-release-unsigned.apk
