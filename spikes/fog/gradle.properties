# Below the main build's settings on purpose: other agents build on the same 16 GB machine.
# Kotlin compiles inside the Gradle daemon, so no second compiler daemon is started.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.compiler.execution.strategy=in-process
org.gradle.workers.max=2
org.gradle.daemon.idletimeout=600000
android.useAndroidX=true
kotlin.code.style=official
