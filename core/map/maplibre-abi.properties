# The fog layer's C++ host (src/main/cpp) implements MapLibre's CustomLayerHost. The AAR ships no
# headers, so src/main/cpp/maplibre/include holds a verbatim copy of three upstream headers, and
# MapLibre calls the host only through their vtable: a reordered virtual method or a changed
# CustomLayerRenderParameters crashes the first frame and no compiler notices.
#
# This file records where the copy came from. The build (verifyMapLibreAbi) fails when the version
# catalog asks for another MapLibre or a header was edited; MapLibreAbiPinTest also checks that the
# AAR on the classpath was built from `commit`, and FogLayer refuses to install at run time when the
# loaded MapLibre reports another version.
#
# To upgrade: copy include/mln/style/layers/{custom_layer_host,custom_layer_init_parameters,
# custom_layer_render_parameters}.hpp from the new tag, read the diff (virtual method order, the
# fields and units of the render parameters, which thread calls what), adapt fog_layer.cpp, then
# update version, tag, commit (the tag's peeled commit, also the AAR's BuildConfig.GIT_REVISION)
# and the hashes below (shasum -a 256).
